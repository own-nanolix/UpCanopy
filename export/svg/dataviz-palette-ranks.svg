if;font-size:13px;font-weight:400;letter-spacing:0.78px;">SECONDARY</text><text x="320" y="116" text-anchor="end" font-size="30" font-weight="500" fill="#1D1D1B" letter-spacing="-1.2" style="color:rgb(22, 37, 87);fill:rgb(29, 29, 27);stroke:none;stroke-width:1px;font-family:'Lexend Exa', 'Arial Black', system-ui, sans-serif;font-size:30px;font-weight:500;letter-spacing:-1.2px;text-anchor:end;">4</text><rect x="0" y="120" width="56" height="48" fill="#052E25" stroke="#4A5568" stroke-width="0" style="color:rgb(22, 37, 87);fill:rgb(5, 46, 37);stroke:rgb(74, 85, 104);stroke-width:0px;" tabindex="0" aria-label="Green Dark: 01 SECUNDÁRIA"/><rect x="64" y="120" width="56" height="48" fill="#1D1D1B" stroke="#4A5568" stroke-width="0" style="color:rgb(22, 37, 87);fill:rgb(29, 29, 27);stroke:rgb(74, 85, 104);stroke-width:0px;" tabindex="0" aria-label="Asfalt: 02 SECUNDÁRIA"/><rect x="128" y="120" width="56" height="48" fill="#F2FFE4" stroke="#4A5568" stroke-width="1" style="color:rgb(22, 37, 87);fill:rgb(242, 255, 228);stroke:rgb(74, 85, 104);stroke-width:1px;" tabindex="0" aria-label="Green Ligth: 03 SECUNDÁRIA"/><rect x="192" y="120" width="56" height="48" fill="#DADADA" stroke="#4A5568" stroke-width="1" style="color:rgb(22, 37, 87);fill:rgb(218, 218, 218);stroke:rgb(74, 85, 104);stroke-width:1px;" tabindex="0" aria-label="Gray: 04 SECUNDÁRIA"/></g><rect x="0" y="190" width="320" height="2" fill="#1D1D1B" opacity="0.9" style="color:rgb(22, 37, 87);fill:rgb(29, 29, 27);stroke:none;stroke-width:1px;opacity:0.9;"/><text x="0" y="216" text-anchor="start" font-size="13" font-weight="400" fill="#1D1D1B" letter-spacing="1.3" style="color:rgb(22, 37, 87);fill:rgb(29, 29, 27);stroke:none;stroke-width:1px;font-family:'Red Hat Display', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:400;letter-spacing:1.3px;">OF 6 COLOURS</text></svg>