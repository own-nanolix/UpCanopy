<svg viewBox="0 0 300 210" data-export="motion-loader-ring" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loader: a thick band sweeping round a ring" style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="210"><title>Loader: a thick band sweeping round a ring</title><rect width="300" height="210" fill="#162557" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;"/><circle cx="150" cy="95" r="44" fill="none" stroke="#6F78B8" stroke-width="12" opacity="0.5" style="color:rgb(22, 37, 87);fill:none;stroke:rgb(111, 120, 184);stroke-width:12px;opacity:0.5;"/><g style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><circle cx="150" cy="95" r="44" fill="none" stroke="#26CF7B" stroke-width="12" stroke-dasharray="92 185" transform="rotate(-90 150 95)" style="color:rgb(22, 37, 87);fill:none;stroke:rgb(38, 207, 123);stroke-width:12px;stroke-dasharray:92px, 185px;"/></g><text x="16" y="28" font-size="14" font-weight="700" fill="#26CF7B" style="color:rgb(22, 37, 87);fill:rgb(38, 207, 123);stroke:none;stroke-width:1px;font-family:'Lexend Exa', 'Arial Black', system-ui, sans-serif;font-size:14px;font-weight:700;">RING</text><text x="16" y="190" font-size="14" fill="#FFFFFF" style="color:rgb(22, 37, 87);fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;font-family:'Red Hat Display', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:400;">ease-in-out, 1600 ms, loops</text></svg>