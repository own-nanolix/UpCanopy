troke-width:1px;font-family:'Red Hat Display', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:12px;font-weight:500;">Descender</text></g><path d="M380 900V420" stroke="#162557" stroke-width="3" style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:rgb(22, 37, 87);stroke-width:3px;"/><path d="M380 400L362 440H398Z" fill="#162557" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;"/><text x="410" y="660" font-size="12" font-weight="500" letter-spacing="1.4" fill="#086338" style="color:rgb(22, 37, 87);fill:rgb(8, 99, 56);stroke:none;stroke-width:1px;font-family:'Lexend Exa', 'Arial Black', system-ui, sans-serif;font-size:12px;font-weight:500;letter-spacing:1.4px;">BOTTOM TO TOP</text><text x="410" y="692" font-size="18" fill="#162557" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;font-family:'Red Hat Display', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:18px;font-weight:400;">Rotated −90° about</text><text x="410" y="716" font-size="18" fill="#162557" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;font-family:'Red Hat Display', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:18px;font-weight:400;">the bottom-left corner.</text><text x="410" y="740" font-size="18" fill="#162557" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;font-family:'Red Hat Display', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:18px;font-weight:400;">Letter tops face left.</text><g clip-path="url(#typography-vertical-clip)" style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;clip-path:url(#typography-vertical-clip);"><rect x="700" y="40" width="460" height="560" fill="#162557" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;"/><g style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><g transform="translate(738 690) rotate(-90)" style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="0" y="250.8" font-size="330" font-weight="500" text-anchor="start" fill="#FFFFFF" letter-spacing="-24.75" style="color:rgb(22, 37, 87);fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;font-family:'Lexend Exa', 'Arial Black', system-ui, sans-serif;font-size:330px;font-weight:500;letter-spacing:-24.75px;">UpCanopy</text></g></g></g><text x="700" y="630" font-size="12" font-weight="500" letter-spacing="1.4" fill="#086338" style="color:rgb(22, 37, 87);fill:rgb(8, 99, 56);stroke:none;stroke-width:1px;font-family:'Lexend Exa', 'Arial Black', system-ui, sans-serif;font-size:12px;font-weight:500;letter-spacing:1.4px;">CROPPED BY THE EDGE, AS ON THE LETTER</text><text x="700" y="660" font-size="19" fill="#162557" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;font-family:'Red Hat Display', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:19px;font-weight:400;">UpCanopy at size 330, cut by the frame.</text><path d="M700 724H1160" stroke="#162557" stroke-opacity="0.2" style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:rgb(22, 37, 87);stroke-width:1px;stroke-opacity:0.2;"/><text x="700" y="764" font-size="12" font-weight="500" letter-spacing="1.4" fill="#086338" style="color:rgb(22, 37, 87);fill:rgb(8, 99, 56);stroke:none;stroke-width:1px;font-family:'Lexend Exa', 'Arial Black', system-ui, sans-serif;font-size:12px;font-weight:500;letter-spacing:1.4px;">HORIZONTAL SETTING, THEN TURNED</text><text x="700" y="830" font-size="56" font-weight="500" text-anchor="start" fill="#162557" letter-spacing="-4.2" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;font-family:'Lexend Exa', 'Arial Black', system-ui, sans-serif;font-size:56px;font-weight:500;letter-spacing:-4.2px;">UpCanopy</text><path d="M700 854H1040" stroke="#162557" stroke-width="2" style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:rgb(22, 37, 87);stroke-width:2px;"/><path d="M1040 854L1022 844V864Z" fill="#162557" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;"/><text x="700" y="890" font-size="19" fill="#162557" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;font-family:'Red Hat Display', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:19px;font-weight:400;">Size 135: the word runs about 6.1 x its size,</text><text x="700" y="916" font-size="19" fill="#162557" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;font-family:'Red Hat Display', 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:19px;font-weight:400;">so the column is about 824 units tall.</text></svg>