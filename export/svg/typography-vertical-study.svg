<svg viewBox="0 0 1200 1000" data-export="typography-vertical-study" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vertical word-mark study: UpCanopy rotated 90 degrees to read from bottom to top, with its cap line, x-line, baseline and descender, and the same word cropped by an edge" style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1000"><title>Vertical word-mark study: UpCanopy rotated 90 degrees to read from bottom to top, with its cap line, x-line, baseline and descender, and the same word cropped by an edge</title><defs style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><clipPath id="typography-vertical-clip" style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><rect x="700" y="40" width="460" height="560" style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"/></clipPath></defs><rect width="1200" height="1000" fill="#F2FFE4" style="color:rgb(22, 37, 87);fill:rgb(242, 255, 228);stroke:none;stroke-width:1px;"/><rect x="40" y="40" width="580" height="920" fill="#FFFFFF" style="color:rgb(22, 37, 87);fill:rgb(255, 255, 255);stroke:none;stroke-width:1px;"/><g style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><g transform="translate(90 950) rotate(-90)" style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="0" y="102.6" font-size="135" font-weight="500" text-anchor="start" fill="#162557" letter-spacing="-10.125" style="color:rgb(22, 37, 87);fill:rgb(22, 37, 87);stroke:none;stroke-width:1px;font-family:'Lexend Exa', 'Arial Black', system-ui, sans-serif;font-size:135px;font-weight:500;letter-spacing:-10.125px;">UpCanopy</text></g></g><g style="color:rgb(22, 37, 87);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><path d="M98.10000000000001 50V950" stroke="#086338" stroke-width="2" stroke-dasharray="10 7" style="color:rgb(22, 37, 87)